<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球媽媽拯救大作戰 × 小科數字人</title>
<style>
  :root {
    --green: #2f7a5b;
    --green-dark: #1f5340;
    --green-soft: #e4f1e8;
    --cream: #fdfbf3;
    --ink: #1e3a30;
    --muted: #6d8a7e;
    --line: #d6e6da;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, #dff0e2 0%, transparent 60%),
      radial-gradient(900px 420px at 100% 110%, #d9ecdf 0%, transparent 55%),
      #eff6f0;
  }

  /* ---------- 頂欄 ---------- */
  .topbar {
    height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    border: 2px solid #fff; box-shadow: 0 2px 8px rgba(31,83,64,.18);
  }
  .brand .title { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .brand .title em { font-style: normal; color: var(--green); }
  .brand .sub {
    font-size: 12px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .badges { display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 12px; color: var(--green-dark); background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
    white-space: nowrap;
  }
  /* 右上角的「四色分類」：看起來像徽章，但可以點開小百科 */
  button.badge {
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  button.badge:hover { background: var(--green-soft); border-color: #bcd9c6; transform: translateY(-1px); }

  /* ---------- 語言切換 ---------- */
  .lang-switch {
    display: flex; background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px; gap: 2px;
  }
  .lang-switch button {
    border: 0; background: transparent; color: var(--muted);
    font-size: 12px; font-family: inherit; padding: 4px 10px;
    border-radius: 999px; cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .lang-switch button:hover { color: var(--green-dark); }
  .lang-switch button.on {
    background: var(--green); color: #fff; font-weight: 600;
  }

  /* ---------- 主佈局：左遊戲 / 右小科 ---------- */
  .layout {
    height: calc(100% - 60px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 402px;
    gap: 14px;
    padding: 0 14px 14px;
    transition: grid-template-columns .28s ease;
  }
  .layout.chat-hidden { grid-template-columns: minmax(0, 1fr) 0px; }
  .layout.chat-hidden .chat-col { display: none; }

  .panel {
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(31,83,64,.07);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel-head {
    height: 44px; flex: 0 0 44px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: #f7fbf7;
  }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .3px; }
  .panel-head h2 span { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .tools { display: flex; gap: 6px; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--green-dark);
    font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    font-family: inherit; transition: .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--green-soft); border-color: #bcd9c6; }
  .btn.ghost { color: var(--muted); }

  /* ---------- 遊戲區 ---------- */
  .game-box {
    position: relative; flex: 1 1 auto; min-height: 0;
    border-radius: 12px; margin: 10px 12px 6px;
    background: #163b3b; overflow: hidden;
  }
  #gameFrame {
    position: absolute; left: 0; top: 0;
    width: 1280px; height: 720px;
    border: 0; transform-origin: top left;
  }

  /* ---------- 全螢幕：原生 API 與手機降級（CSS 沉浸）共用一套外觀 ---------- */
  .game-box:fullscreen,
  .game-box:-webkit-full-screen {
    width: 100vw; height: 100vh; margin: 0; border-radius: 0;
    background: #0a1a17;
  }
  body.pseudo-full { overflow: hidden; }
  body.pseudo-full .game-box {
    position: fixed; inset: 0; z-index: 9998;
    width: 100%; height: 100vh; height: 100dvh;
    margin: 0; border-radius: 0; background: #0a1a17;
    aspect-ratio: auto; flex: 0 0 auto;
  }
  /* 進入全螢幕後給一個明確的出口：手機沒有 Esc 鍵 */
  .fs-exit {
    position: absolute; z-index: 21; display: none;
    align-items: center; gap: 6px;
    right: calc(12px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.32);
    background: rgba(8,26,22,.72); color: #eaf6ee;
    font: 600 13px/1 inherit; -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px); transition: background .15s;
  }
  .fs-exit:hover, .fs-exit:active { background: rgba(8,26,22,.92); }
  body.in-full .fs-exit,
  .game-box:fullscreen .fs-exit,
  .game-box:-webkit-full-screen .fs-exit { display: inline-flex; }
  .fs-tip {
    position: absolute; z-index: 21; display: none; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding: 8px 14px; border-radius: 999px; pointer-events: none;
    background: rgba(8,26,22,.72); color: #d8ecdf; font-size: 12px; white-space: nowrap;
  }
  @media (orientation: portrait) {
    body.in-full .fs-tip { display: block; }
  }
  body.in-full.rotate-game .fs-tip { display: block; }
  .game-hint {
    flex: 0 0 auto; margin: 0 12px 10px; font-size: 12px; color: var(--muted);
  }
  .game-hint kbd {
    background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: inherit;
  }
  .loader {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 12px;
    background: #163b3b; color: #d8ecdf; font-size: 13px; z-index: 3;
    transition: opacity .4s; text-align: center; padding: 0 20px;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.2); border-top-color: #8fd6a8;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 小科區 ---------- */
  #chatFrame { flex: 1 1 auto; width: 100%; border: 0; min-height: 0; background: #fff; }
  .chat-tip {
    flex: 0 0 auto; font-size: 11px; color: var(--muted); padding: 6px 12px 9px;
    border-top: 1px solid var(--line); background: #f9fcf9;
  }

  /* ---------- 浮動地球頭像 ---------- */
  .fab {
    position: fixed; right: 22px; bottom: 22px; z-index: 40;
    width: 68px; height: 68px; border-radius: 50%; border: 3px solid #fff;
    background: #dff0e4 url("assets/mother-earth-avatar.png") center/cover no-repeat;
    box-shadow: 0 10px 24px rgba(31,83,64,.28); cursor: pointer;
    transition: transform .18s;
  }
  .fab:hover { transform: translateY(-3px) scale(1.04); }
  .fab::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(47,122,91,.45); animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.92); opacity: .85; }
    70% { transform: scale(1.18); opacity: 0; }
    100% { opacity: 0; }
  }
  .fab-label {
    position: absolute; right: 78px; top: 50%; transform: translateY(-50%);
    background: #fff; color: var(--green-dark); font-size: 12px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(31,83,64,.16); opacity: 0; transition: .2s;
    pointer-events: none;
  }
  .fab:hover .fab-label { opacity: 1; right: 82px; }

  /* ---------- 說明／四色彈窗 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(20,45,36,.45); backdrop-filter: blur(3px);
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--cream); border-radius: 18px; max-width: 560px; width: 100%;
    max-height: 82vh; overflow: auto; padding: 22px 24px;
    box-shadow: 0 24px 60px rgba(15,40,30,.3);
  }
  .modal-card.wide { max-width: 680px; }
  .modal-card:focus { outline: none; }
  .modal-card h3 { margin: 0 0 4px; font-size: 18px; }
  .modal-card p { font-size: 13px; line-height: 1.75; color: #33544a; margin: 8px 0; }
  .modal-card ul { font-size: 13px; line-height: 1.9; color: #33544a; padding-left: 20px; }
  .modal-card .close-row { text-align: right; margin-top: 14px; }
  .bin-row { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  .bin {
    flex: 1 1 100px; border-radius: 12px; padding: 8px 8px 10px; color: #fff;
    font-size: 12px; font-weight: 600; text-align: center;
  }
  .bin img { width: 52px; height: 52px; display: block; margin: 0 auto 2px; object-fit: contain; }
  .bin.b-paper { background: #3265ac; }
  .bin.b-plastic { background: #e0b028; color: #3a2d05; }
  .bin.b-metal { background: #8a5340; }
  .bin.b-general { background: #34795d; }

  .item-strip { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
  .item-strip figure {
    margin: 0; width: 72px; text-align: center; font-size: 10px; color: #4a6a5e;
    line-height: 1.35;
  }
  .item-strip img { width: 40px; height: 40px; object-fit: contain; }

  /* ---------- 四色分類小百科 ---------- */
  .bin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
  .bin-card {
    border-radius: 14px; padding: 12px 14px; color: #fff; position: relative;
    overflow: hidden;
  }
  .bin-card.paper { background: #3265ac; }
  .bin-card.plastic { background: #e8b52c; color: #3a2d05; }
  .bin-card.metal { background: #8a5340; }
  .bin-card.general { background: #34795d; }
  .bin-card .bh { display: flex; align-items: center; gap: 9px; }
  .bin-card .bh img { width: 40px; height: 40px; object-fit: contain; }
  .bin-card .bn { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .bin-card .bt { font-size: 11px; opacity: .88; margin-top: 1px; }
  .bin-card .bd { font-size: 12.5px; line-height: 1.65; margin: 9px 0 0; }
  .bin-card .bw {
    font-size: 11.5px; line-height: 1.6; margin: 8px 0 0; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.35); opacity: .92;
  }
  .bin-card.plastic .bw { border-top-color: rgba(58,45,5,.25); }
  @media (max-width: 520px) {
    .bin-grid { grid-template-columns: 1fr; }
  }

  /* ---------- 窄螢幕：小科變成抽屜，遊戲改為固定 16:9 ---------- */
  @media (max-width: 1080px) {
    html, body { overflow-y: auto; }
    .layout {
      grid-template-columns: minmax(0, 1fr);
      height: auto; min-height: calc(100% - 60px);
      align-items: start;
    }
    .chat-col {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(94vw, 420px);
      z-index: 45; border-radius: 0; border-left: 1px solid var(--line);
      transform: translateX(105%); transition: transform .3s ease;
      box-shadow: -12px 0 40px rgba(20,45,36,.18);
    }
    .layout.chat-open .chat-col { transform: translateX(0); }
    .layout.chat-hidden .chat-col { display: flex; }
    .layout.chat-hidden { grid-template-columns: minmax(0, 1fr); }
    .brand .sub { display: none; }
    .topbar { height: auto; padding: 10px 14px; flex-wrap: wrap; }
    .layout { min-height: 0; }
    .game-box { flex: 0 0 auto; aspect-ratio: 16 / 9; }
    .fab { width: 58px; height: 58px; right: 16px; bottom: 16px; }
  }

  /* 手機：標題列改為可換行，按鈕縮小但不拆字 */
  @media (max-width: 600px) {
    .panel-head {
      height: auto; flex: 0 0 auto; padding: 7px 10px;
      flex-wrap: wrap; gap: 6px;
    }
    .panel-head h2 { font-size: 12px; }
    .panel-head h2 span { margin-left: 4px; }
    .tools { flex-wrap: nowrap; }
    .btn { font-size: 11px; padding: 4px 9px; }
    .badges { flex-wrap: wrap; gap: 6px; }
    .layout { padding: 0 10px 10px; gap: 10px; }
    /* 彈窗：外邊距收窄、底部留白加大，最後一張桶卡不會貼邊 */
    .modal { padding: 14px; }
    .modal-card {
      padding: 16px 14px 22px; max-height: 88vh; border-radius: 16px;
    }
    .modal-card h3 { font-size: 16px; }
    .bin-card { padding: 11px 12px; }

    /* 手機：小科不再做全屏抽屜，改成內嵌在遊戲下方。
       理由：豎屏 16:9 遊戲只佔上半屏，抽屜一開就蓋住畫面；
       內嵌後往下滑就能問小科，收起時圓形頭像會重新出現。 */
    .chat-col {
      position: static; transform: none;
      /* Gradio 內部內容實測約 603px（聊天區 460 + 輸入框），
         面板矮於 690px 就會把輸入框裁到 iframe 之外，所以下限鎖 690。 */
      width: 100%; height: min(78vh, 720px); min-height: 690px;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(31,83,64,.07);
    }
    /* 滾動交還文檔層：body 自帶 100% 高 + overflow 會變成雙層滾動容器 */
    html, body { height: auto; min-height: 100%; overflow: visible; }
    .layout.chat-open .chat-col { transform: none; }
    .layout.chat-hidden .chat-col { display: none; }
    .fab { display: none; }
    .layout.chat-hidden ~ .fab { display: flex; }
  }
</style>
  <link rel="icon" href="assets/mother-earth-avatar.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="assets/mother-earth-avatar.png" alt="Mother Earth">
    <div>
      <div class="title" id="brandTitle">地球媽媽拯救大作戰 <em>× 小科</em></div>
      <div class="sub" id="brandSub">香港小四至小五｜垃圾分類 × 計算思維 × STEM 數字人</div>
    </div>
  </div>
  <div class="badges">
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="hk">粵語</button>
      <button type="button" data-lang="cn">普通話</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <button class="badge" id="btnBins" type="button">♻️ 四色分類</button>
    <span class="badge" id="badgeChat">🤖 小科陪你</span>
  </div>
</header>

<div class="layout" id="layout">

  <!-- 左：遊戲 -->
  <section class="panel">
    <div class="panel-head">
      <h2><span id="gameTitle">🎮 遊戲區</span> <span id="gameSub">第 0–4 關 · 課後小測</span></h2>
      <div class="tools">
        <button class="btn" id="btnReload">重新載入</button>
        <button class="btn" id="btnFull">全螢幕</button>
        <button class="btn ghost" id="btnHelp">玩法說明</button>
      </div>
    </div>
    <div class="game-box" id="gameBox">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div id="loaderText">正在準備地球媽媽的遊戲世界…（首次載入約 10–20 秒）</div>
      </div>
      <iframe id="gameFrame" src="game/index.html?v=8d7666d5" title="地球媽媽拯救大作戰"
              allow="fullscreen; autoplay; clipboard-write"></iframe>
      <button class="fs-exit" id="btnFullExit" type="button">退出全螢幕 ✕</button>
      <div class="fs-tip" id="fsTip">建議橫放手機，畫面會更大 ↻</div>
    </div>
    <p class="game-hint" id="gameHint">
      提示：先點一下遊戲畫面，鍵盤才會生效 — <kbd>P</kbd> 暫停 ·
      <kbd>R</kbd> 重玩 · <kbd>Esc</kbd> 返回選關。不懂就問右下角的小科 🌏
    </p>
  </section>

  <!-- 右：小科數字人 -->
  <aside class="panel chat-col" id="chatPanel">
    <div class="panel-head">
      <h2><span id="chatTitle">🌏 小科</span> <span id="chatSub">地球老師</span></h2>
      <button class="btn ghost" id="btnCloseChat">收起 ✕</button>
    </div>
    <iframe id="chatFrame" src="xiaoke.html?lang=hk" title="小科數字人"
            allow="autoplay; clipboard-write"></iframe>
    <div class="chat-tip" id="chatTip">可以問「膠樽放邊個桶？」，或者話「我想被你考考」。</div>
  </aside>
</div>

<button class="fab" id="fab" aria-label="ask Xiao Ke">
  <span class="fab-label" id="fabLabel">問小科 🌏</span>
</button>

<!-- 玩法說明 -->
<div class="modal" id="helpModal">
  <div class="modal-card">
    <div id="helpBody"></div>
    <div class="close-row"><button class="btn" id="btnCloseHelp">明白啦</button></div>
  </div>
</div>

<!-- 四色分類小百科 -->
<div class="modal" id="binsModal">
  <div class="modal-card wide">
    <div id="binsBody"></div>
    <div class="close-row"><button class="btn" id="btnCloseBins">明白啦</button></div>
  </div>
</div>

<script>
/* =========================================================================

   hk = 粵語繁體、cn = 普通話簡體、en = English

/* =========================================================================
   三、版面與互動
   ========================================================================= */
const W = 1280, H = 720;

/* 把 1280×720 的遊戲畫面等比縮放到容器內（不裁切、不留黑邊）。
   全螢幕＋豎屏時，16:9 只會在中間變成一條扁帶（390×219），跟原本差不多大，
   所以這時把畫面順時針轉 90°，讓它先佔滿屏幕，學生把手機橫放就自然接回正常方向。 */
function fitGame() {
  const box = gameBox.getBoundingClientRect();
  if (!box.width || !box.height) return;

  const portrait = box.height > box.width * 1.2;
  const rotate = inFullMode() && portrait;
  document.body.classList.toggle('rotate-game', rotate);

  if (rotate) {
    const s = Math.min(box.width / H, box.height / W);
    /* 旋轉後內容佔 x ∈ [-H·s, 0]、y ∈ [0, W·s]，平移把它擺到正中 */
    const tx = (box.width + H * s) / 2;
    const ty = (box.height - W * s) / 2;
    gameFrame.style.transform = `translate(${tx}px, ${ty}px) rotate(90deg) scale(${s})`;
    return;
  }

  const scale = Math.min(box.width / W, box.height / H);
  const dx = (box.width - W * scale) / 2;
  const dy = (box.height - H * scale) / 2;
  gameFrame.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
}
window.addEventListener('resize', fitGame);
document.addEventListener('fullscreenchange', () => setTimeout(fitGame, 120));
fitGame();
setInterval(fitGame, 800);           // 面板收合有動畫，補幾次校正

/* 遊戲載入完成後淡出遮罩（pygbag 會把 canvas 顯示出來）。 */
gameFrame.addEventListener('load', () => {

/* 收起／展開小科：寬螢幕收合右欄，平板是抽屜，手機（≤600px）是內嵌 */

/* 全螢幕只放大遊戲區，不會影響右邊的小科。
   手機（特別是 iPhone 的 Safari）不支援對任意 <div> 呼叫 Fullscreen API，
   呼叫不存在的方法時整句會被 optional chaining 短路、錯誤又被 catch 吃掉，
   表面現象就是「點全螢幕完全沒反應」。所以這裡做三層：
   1) 標準 API → 2) webkit/ms 前綴 → 3) 全部失敗就用 CSS 沉浸模式（fixed 鋪滿畫面）。 */
/* 用 var 而不是 let：上面的 fitGame() 一開頁就會執行並呼叫 inFullMode()，
   若這裡是 let，讀取時會落在 TDZ 直接報錯。 */
var pseudoFull = false;

function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement
      || document.msFullscreenElement || null;
}
function inFullMode() { return !!(fsElement() || pseudoFull); }

function setPseudoFull(on) {
  pseudoFull = on;
  document.body.classList.toggle('pseudo-full', on);
  document.body.classList.toggle('in-full', on);
  $('btnFull').textContent = T(on ? 'fullExit' : 'full');
  setTimeout(fitGame, 60);
  setTimeout(fitGame, 360);      // 手機地址欄收合後再校正一次
}

function syncFullUI() {
  const on = inFullMode();
  document.body.classList.toggle('in-full', on);
  $('btnFull').textContent = T(on ? 'fullExit' : 'full');
  setTimeout(fitGame, 120);
}

function enterFull() {
  const el = gameBox;
  if (el.webkitRequestFullscreen === undefined && el.requestFullscreen === undefined
      && el.msRequestFullscreen === undefined) {
    setPseudoFull(true);
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  try {
    const ret = req.call(el);
    if (ret && typeof ret.then === 'function') {
      ret.then(() => syncFullUI()).catch(() => setPseudoFull(true));
    } else {
      /* 舊 webkit 是同步的、回傳 undefined，稍後確認有沒有真的進去 */
      setTimeout(() => { if (fsElement()) syncFullUI(); else setPseudoFull(true); }, 260);
    }
  } catch (err) {
    setPseudoFull(true);
  }
}

function exitFull() {
  const el = fsElement();
  if (el) {
    const d = document;
    try {
      if (d.exitFullscreen) d.exitFullscreen();
      else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
      else if (d.msExitFullscreen) d.msExitFullscreen();
    } catch (err) { /* 交回給 UI 同步處理 */ }
  }
  if (pseudoFull) setPseudoFull(false);
  setTimeout(fitGame, 200);
}

$('btnFull').addEventListener('click', () => {
  if (inFullMode()) exitFull(); else enterFull();
});
$('btnFullExit').addEventListener('click', exitFull);

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach((ev) => {
  document.addEventListener(ev, () => { if (!pseudoFull) syncFullUI(); });
});

/* 手機沒有 Esc 鍵，但接外接鍵盤或桌面瀏覽器時仍然可用 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && pseudoFull) setPseudoFull(false);
});

/* 兩個彈窗：玩法說明、四色分類 */
const helpModal = $('helpModal');
const binsModal = $('binsModal');

/* 遊戲 iframe 會自己搶焦點，焦點一旦落在 iframe 內，主文檔就收不到 Esc。
   所以開窗時把焦點移進彈窗卡片，關窗後再盡量還給遊戲（失敗也不影響）。 */
function openModal(m) {
  m.classList.add('open');
  const card = m.querySelector('.modal-card');
  if (card) {
    card.setAttribute('tabindex', '-1');
    card.focus({ preventScroll: true });
  }
}
function closeModal(m) {
  m.classList.remove('open');
  try { gameFrame.contentWindow.focus(); } catch (err) { /* 跨域或被沙箱擋住就算了 */ }
}

$('btnHelp').addEventListener('click', () => openModal(helpModal));

  if (e.key === 'Escape') {
    if (helpModal.classList.contains('open')) closeModal(helpModal);
    else if (binsModal.classList.contains('open')) closeModal(binsModal);
  }
});

/* Gradio 在 iframe 內會自帶標題列與頁尾，這裡同源移除，讓面板更乾淨。 */
function refreshChat() {
  try {
    const doc = chatFrame.contentDocument;
    if (!doc || !doc.head) return;
    if (!doc.getElementById('embed-fix')) {
      const style = doc.createElement('style');
      style.id = 'embed-fix';
      style.textContent = [
        'footer{display:none!important}',
        '.gradio-container{padding:0!important;max-width:100%!important}',
        '#xiaoke-header{display:none!important}',   /* 外層已有標題，避免重複 */
        '.examples{display:none!important}',
        'gradio-app{display:block;height:100%!important}',
      ].join('\n');
      doc.head.appendChild(style);
    }
  } catch (e) { /* 跨來源時略過 */ }
}
chatFrame.addEventListener('load', () => { setTimeout(refreshChat, 600); });
setTimeout(refreshChat, 2500);

/* 啟動：套用上次選的語言（預設粵語） */
applyLang(lang, { silent: true });
</script>
</body>
</html>
